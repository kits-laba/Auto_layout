name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use older Android NDK
        run: |
          ls /usr/local/lib/android/sdk/ndk || true
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/27.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/28.* 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using NDK: $NDK_DIR"
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_LATEST_HOME=$NDK_DIR" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
            echo "ANDROID_NDK=$NDK_DIR" >> $GITHUB_ENV
          fi
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
